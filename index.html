<style>

    --purple: #bc13fe;

    --orange: #ff9900;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;

  /* ── SCROLLBAR ── */

  /* ── CANVAS BG ── */

    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    z-index: -2; pointer-events: none;
  }

  /* ── CRT SCANLINES ── */
  body::after {

    background:

      linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.015), rgba(0,0,255,0.04));
    background-size: 100% 4px, 3px 100%;
    z-index: 9999; pointer-events: none; opacity: 0.25;
  }

  /* ── SCAN BEAM ── */
  .scan-beam {
    position: fixed; left: 0; top: 0;
    width: 100vw; height: 8vh;
    background: linear-gradient(transparent, rgba(0,243,255,0.06), transparent);
    z-index: 9998; pointer-events: none;
    animation: scanMove 10s linear infinite;

  @keyframes scanMove { 0%{transform:translateY(-10vh)} 100%{transform:translateY(110vh)} }

  /* ── CURSOR ── */
  .cur-dot {
    position: fixed; width: 6px; height: 6px;
    background: var(--cyber); border-radius: 50%;
    pointer-events: none; z-index: 99999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 8px var(--cyber);
    transition: transform 0.05s;
  }
  .cur-ring {
    position: fixed; width: 34px; height: 34px;
    border: 1.5px solid rgba(0,243,255,0.55);
    border-radius: 50%; pointer-events: none;
    z-index: 99998; transform: translate(-50%,-50%);

  .cur-ring.hover { width: 50px; height: 50px; background: rgba(0,243,255,0.04); border-color: var(--cyber); }

  /* ── BOOT SCREEN ── */

    position: fixed; inset: 0;

    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--neon);

  .mt-bar { display:flex; align-items:center; gap:6px; padding:9px 14px; background:rgba(12,20,36,0.9); border-bottom:1px solid rgba(0,243,255,0.08); }

  .info-tbl { border:1px solid rgba(0,243,255,0.1); border-radius:6px; overflow:hidden; background:rgba(10,15,26,0.7); }

  .ik { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text3); letter-spacing:1px; }

  .quote-wrap { display:flex; gap:12px; align-items:stretch; margin:14px 0; }
  .q-line { width:3px; background:var(--cyber); border-radius:2px; flex-shrink:0; }

    display:flex; align-items:center; gap:14px;

  .tc { background:rgba(0,243,255,0.05); border:1px solid rgba(0,243,255,0.2); color:var(--cyber); }

</style>
</head>

/* ═══ HOOKS ═══ */
function useReveal(threshold=0.12) {
  const ref = useRef();
  const [vis, setVis] = useState(false);
  useEffect(()=>{
    const obs = new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setVis(true); obs.disconnect(); } },{ threshold });
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);
  return [ref, vis];
}

function useTypewriter(words) {
  const [text, setText] = useState('');
  const [wi, setWi] = useState(0);
  const [ci, setCi] = useState(0);
  const [del, setDel] = useState(false);
  useEffect(()=>{
    const cur = words[wi];
    const spd = del ? 55 : 95;
    const t = setTimeout(()=>{
      if(!del){ setText(cur.substring(0,ci+1)); if(ci+1===cur.length){ setTimeout(()=>setDel(true),2000); return; } setCi(c=>c+1); }
      else { setText(cur.substring(0,ci-1)); if(ci-1===0){ setDel(false); setWi(w=>(w+1)%words.length); setCi(0); return; } setCi(c=>c-1); }
    }, spd);
    return ()=>clearTimeout(t);
  },[text,wi,ci,del,words]);
  return text;
}

/* ═══ PARTICLE NETWORK — EXACT FROM UPLOADED THEME ═══ */
function initParticles() {
  const canvas = document.getElementById('bg-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const mob = window.innerWidth < 768;
  const COUNT = mob ? 45 : 90;
  const SPEED = mob ? 0.45 : 1.4;
  const DIST  = mob ? 125 : 180;
  let W, H;
  const resize = ()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; };
  window.addEventListener('resize', resize); resize();
  class P {
    constructor(){ this.x=Math.random()*W; this.y=Math.random()*H; this.vx=(Math.random()-.5)*SPEED; this.vy=(Math.random()-.5)*SPEED; this.r=Math.random()*2+1; }
    update(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>W)this.vx*=-1; if(this.y<0||this.y>H)this.vy*=-1; }
    draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle='rgba(0,243,255,0.65)'; ctx.fill(); }
  }
  const pts = Array.from({length:COUNT},()=>new P());
  let mx=null,my=null;
  if(!mob){ window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;}); window.addEventListener('mouseleave',()=>{mx=null;my=null;}); }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      if(mx!==null){ const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy); if(d<200){p.vx+=dx*.00012;p.vy+=dy*.00012;} }
      p.update(); p.draw();
    });
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<DIST){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.strokeStyle=`rgba(0,243,255,${1-d/DIST})`; ctx.lineWidth=0.6; ctx.stroke(); }
    }
    requestAnimationFrame(loop);
  })();
}

/* ═══ CURSOR ═══ */
function initCursor() {
  const dot=document.getElementById('curDot'); const ring=document.getElementById('curRing');
  if(!dot||!ring) return;
  let ox=0,oy=0;
  window.addEventListener('mousemove',e=>{
    dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px';
    ox+=(e.clientX-ox)*.13; oy+=(e.clientY-oy)*.13;
    ring.style.left=ox+'px'; ring.style.top=oy+'px';
  });
  document.querySelectorAll('a,button,.skill-box,.proj-box,.c-item,.etag,.photo-frame').forEach(el=>{
    el.addEventListener('mouseenter',()=>ring.classList.add('hover'));
    el.addEventListener('mouseleave',()=>ring.classList.remove('hover'));
  });
  requestAnimationFrame(function raf(){ ox+=(parseFloat(ring.style.left||0)-ox)*.12; oy+=(parseFloat(ring.style.top||0)-oy)*.12; ring.style.left=ox+'px'; ring.style.top=oy+'px'; requestAnimationFrame(raf); });
}

function runBoot(onDone) {

  if(!log) return;
  let i=0;
  const add=()=>{
    if(i>=lines.length){ stat.textContent='LAUNCHING...'; setTimeout(()=>{ document.getElementById('boot-screen').classList.add('gone'); setTimeout(onDone,700); },400); return; }
    const s=document.createElement('span'); s.textContent=lines[i];
    if(i===lines.length-1){s.style.color='#00f3ff';s.style.fontWeight='bold';}
    log.appendChild(s); log.scrollTop=log.scrollHeight;
    const p=Math.round(((i+1)/lines.length)*100);
    fill.style.width=p+'%'; pct.textContent=p+'%';
    stat.textContent=p<50?'LOADING MODULES...':p<80?'AUTHENTICATING...':'FINALIZING...';
    i++; setTimeout(add,290);
  };
  document.body.style.overflow='hidden'; setTimeout(add,500);
}
